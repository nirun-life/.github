name: build-image-selftest

# Exercises build-image.yml on every change to it:
# - pull_request: the image is built and scanned, and must NOT be pushed;
# - push (any branch): the image must be pushed, signed, and return a digest that
#   resolves in GHCR and passes cosign verification for this repository.

on:
  pull_request:
    paths:
      - .github/workflows/build-image.yml
      - .github/workflows/build-image-selftest.yml
      - .github/build-image-selftest/**
  push:
    paths:
      - .github/workflows/build-image.yml
      - .github/workflows/build-image-selftest.yml
      - .github/build-image-selftest/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-image-selftest-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  image:
    needs: lint
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: nirun-life/build-image-selftest
      context: .github/build-image-selftest

  verify:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      EVENT: ${{ github.event_name }}
      PUSHED: ${{ needs.image.outputs.pushed }}
      DIGEST: ${{ needs.image.outputs.digest }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Pull requests build but never push
        if: github.event_name == 'pull_request'
        run: |
          [[ $PUSHED == false && -z $DIGEST && -z $IMAGE ]] ||
            { echo "::error::pull request run pushed or returned a digest: pushed=$PUSHED digest=$DIGEST"; exit 1; }
          echo "ok: pull request build was not pushed"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
        with:
          cosign-release: v3.1.3
      # The signing identity of a reusable workflow is the reusable workflow
      # itself, not the caller: callers verify against build-image.yml.
      - name: Pushed digest resolves and is signed by build-image.yml
        if: github.event_name != 'pull_request'
        env:
          SIGNER: ^https://github[.]com/nirun-life/[.]github/[.]github/workflows/build-image[.]yml@
        run: |
          set -euo pipefail
          expected="ghcr.io/nirun-life/build-image-selftest@$DIGEST"
          [[ $PUSHED == true && $DIGEST =~ ^sha256:[0-9a-f]{64}$ && $IMAGE == "$expected" ]] ||
            { echo "::error::unexpected outputs: pushed=$PUSHED digest=$DIGEST image=$IMAGE"; exit 1; }
          docker buildx imagetools inspect "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$SIGNER" \
            >/dev/null
          echo "ok: $IMAGE resolves and has a valid signature" | tee -a "$GITHUB_STEP_SUMMARY"
